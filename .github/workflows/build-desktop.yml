name: 构建桌面版并发布版本 Release

on:
  push:
    branches: [desktop]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'build/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            paths: '*.AppImage'
          - os: windows-latest
            name: windows
            paths: |
              release/*.exe
              release/*.zip
          - os: macos-latest
            name: macos
            paths: '*.dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 打包（${{ matrix.name }}）
        run: npx electron-builder --publish never

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yunhulaoda-desktop-${{ matrix.name }}
          path: ${{ matrix.paths }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（gh release 需要 git 上下文）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布版本 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          NOTES="云湖牢大版 v$VER（桌面端）· commit ${{ github.sha }}

          ## 产物
          - Windows x64 安装包：yunhulaoda-$VER-windows-x64-setup.exe
          - Windows x64 便携版：yunhulaoda-$VER-windows-x64.zip
          - Linux x64：yunhulaoda-$VER-linux-x64.AppImage
          - macOS：yunhulaoda-$VER-macos-*.dmg

          ## 构建方式
          GitHub Actions（.github/workflows/build-desktop.yml）：npm ci → npm run build → electron-builder。

          ## 已知问题
          - Windows/macOS 未代码签名，安装时如提示未知来源请手动允许。

          ## 变更（自上一 tag）
          $(git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~30)..HEAD | head -50 || true)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "云湖牢大版 v$VER" --notes "$NOTES"
          fi
