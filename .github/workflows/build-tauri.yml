name: 构建 Tauri 桌面版并发布 Release

on:
  push:
    branches: [desktop]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'webdav.ts'
      - 'satori.ts'
      - 'satori-ws.ts'
      - 'src-tauri/**'
      - 'scripts/build-server-bundle.mjs'
      - 'package.json'
      - '.github/workflows/build-tauri.yml'
  workflow_dispatch:

concurrency:
  group: tauri-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端 + server bundle
        run: |
          npm run build
          node scripts/build-server-bundle.mjs

      - name: 准备 sidecar 资源（node.exe + dist）
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/resources/dist
          cp dist/index.html src-tauri/resources/dist/
          cp -r dist/assets src-tauri/resources/dist/assets
          # node.exe 从 runner 自带 node 复制（版本与 setup-node 一致）
          NODE_EXE=$(which node.exe || where node | head -1)
          cp "$NODE_EXE" src-tauri/resources/node.exe
          ls -la src-tauri/resources/

      - name: 构建 Tauri（NSIS + portable）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --bundles nsis,portable

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yunhulaoda-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（gh release 需要 git 上下文）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 按发布规范重命名
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          mkdir -p out
          for f in artifacts/*-setup*.exe; do [ -e "$f" ] && cp "$f" "out/yunhulaoda-$VER-windows-x64-tauri-setup.exe"; done
          for f in artifacts/*.exe; do
            case "$f" in *-setup*) ;; *) cp "$f" "out/yunhulaoda-$VER-windows-x64-tauri-portable.exe";; esac
          done
          ls -la out/

      - name: 发布到 Release（存在则覆盖上传，不删不重建）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" out/* --title "云湖牢大版 v$VER" --notes "见 docs/release-$VER.md"
          else
            gh release upload "$TAG" out/* --clobber
          fi
